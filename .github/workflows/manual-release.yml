name: Manual Release Prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v2.3.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Rebuild Dist
        run: npm run build

      - name: Commit Dist and Tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # Force update dist in case it changed
          git add dist/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "Dist is already up to date."
          else
            git commit -m "chore: Update dist for release $INPUT_VERSION [skip ci]"
            git push origin master
          fi

          # Create and Push Tag
          git tag "$INPUT_VERSION"
          git push origin "$INPUT_VERSION"
          
          echo "✅ Tag $INPUT_VERSION push complete."

      - name: Get version without v
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          safe=$(printf '%s' "$INPUT_VERSION" | tr -d '\n\r')
          echo "VERSION=$(echo "$safe" | sed 's/v//')" >> "$GITHUB_OUTPUT"

      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2
        with:
          version: ${{ steps.get_version.outputs.VERSION }}
          path: ./CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ inputs.version }}
          tag_name: ${{ inputs.version }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          draft: false
          prerelease: false
          files: |
            dist/**/*
            LICENSE
            README.md
            action.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
