name: Test Action

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'action.yml'
      - '.github/workflows/test.yml'

permissions: {}

jobs:
  test-action-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Create test file
        run: echo "This is a test file" > test-file.txt

      # This step will be skipped in PR builds since secrets are not available
      # It will only run when manually triggered with workflow_dispatch
      - name: Test Action (if credentials available)
        if: github.event_name == 'workflow_dispatch'
        uses: ./
        continue-on-error: true
        id: test_upload
        with:
          target: test-file.txt
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          parent_folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}
          name: test-upload.txt
          override: true

      - name: Check if upload was attempted
        if: github.event_name == 'workflow_dispatch'
        env:
          TEST_UPLOAD_OUTCOME: ${{ steps.test_upload.outcome }}
        run: |
          if [ "$TEST_UPLOAD_OUTCOME" == "success" ]; then
            echo "✅ Upload test passed"
          else
            echo "❌ Upload test failed"
            exit 1
          fi
