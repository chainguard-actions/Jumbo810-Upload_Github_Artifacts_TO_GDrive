name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.node-version'
      - '.eslintrc.js'
      - '.github/**'
      - 'action.yml'
      - 'dist/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.node-version'
      - '.eslintrc.js'
      - '.github/**'
      - 'action.yml'
      - 'dist/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Node
      uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
      with:
        node-version: '22.x'

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Node
      uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
      with:
        node-version: '22.x'

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build
      
    - name: Upload dist
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: dist
        path: dist/
        retention-days: 7
