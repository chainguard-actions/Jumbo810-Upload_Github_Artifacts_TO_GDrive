name: Test glob pattern target with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple test files for glob upload
        run: |
          mkdir -p /tmp/glob-test
          echo "file one content" > /tmp/glob-test/file1.txt
          echo "file two content" > /tmp/glob-test/file2.txt
          echo "file three content" > /tmp/glob-test/file3.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: 'eyJpbnZhbGlkIjoianNvbiJ9'
          parent_folder_id: 'fake-folder-id-12345'
          target: '/tmp/glob-test/*.txt'

      - name: Assert action failed (invalid credentials, glob path exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials on glob target, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using glob pattern with invalid credentials"
