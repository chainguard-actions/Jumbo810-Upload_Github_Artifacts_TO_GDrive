name: Test invalid replace_mode validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy target file
        run: echo "test content" > /tmp/test-artifact.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: 'aW52YWxpZC1jcmVkZW50aWFscw=='
          parent_folder_id: 'fake-folder-id'
          target: '/tmp/test-artifact.txt'
          replace_mode: 'invalid_mode_xyz'

      - name: Assert action failed due to invalid replace_mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid replace_mode, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid replace_mode"
