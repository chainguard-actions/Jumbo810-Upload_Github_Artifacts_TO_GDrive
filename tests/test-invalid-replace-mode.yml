name: Test invalid replace_mode value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy target file
        run: echo "hello world" > /tmp/test-upload.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: 'not-real-credentials'
          parent_folder_id: 'fake-folder-id'
          target: '/tmp/test-upload.txt'
          replace_mode: 'invalid_mode_value'

      - name: Assert action failed due to invalid replace_mode
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid replace_mode"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid replace_mode"
