name: Test child folder and override options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to upload
        run: |
          echo "test content for child folder" > /tmp/test-child.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: ${{ 'eyJrZXkiOiAiZmFrZSJ9' }}
          parent_folder_id: "fake_folder_id_12345"
          target: "/tmp/test-child.txt"
          child_folder: "subfolder/nested"
          override: "true"
          name: "renamed-test-file.txt"

      - name: Assert action failed with invalid credentials (child folder scenario)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials for child folder scenario"
