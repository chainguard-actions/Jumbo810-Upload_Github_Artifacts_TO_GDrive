name: Test share_with and send_share_notification inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test artifact file
        run: |
          echo "share test artifact" > /tmp/share-test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: ${{ 'eyJmYWtlIjoidGVzdCJ9' }}
          parent_folder_id: "fake-folder-id-12345"
          target: /tmp/share-test.txt
          share_with: "user1@example.com,user2@example.com"
          send_share_notification: false

      - name: Assert action ran with share_with input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with an auth/API error,
          # not crash due to share_with input parsing.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted share_with input and ran"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
