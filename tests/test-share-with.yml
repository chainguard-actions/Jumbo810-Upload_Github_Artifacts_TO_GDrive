name: Test share_with input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to upload
        run: echo "test content" > /tmp/test-share.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: aW52YWxpZC1jcmVkZW50aWFscw==
          parent_folder_id: fake-folder-id
          target: /tmp/test-share.txt
          share_with: user@example.com,another@example.com
          send_share_notification: false

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when share_with is set"
