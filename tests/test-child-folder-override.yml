name: Test child_folder and override options with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to upload
        run: |
          echo "test content for child folder upload" > /tmp/child-folder-test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: 'eyJpbnZhbGlkIjoianNvbiJ9'
          parent_folder_id: 'fake-folder-id-12345'
          target: '/tmp/child-folder-test.txt'
          child_folder: 'my-sub-folder/nested'
          override: true
          name: 'renamed-upload.txt'

      - name: Assert action failed with invalid credentials (child_folder + override path exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using child_folder and override with invalid credentials"
