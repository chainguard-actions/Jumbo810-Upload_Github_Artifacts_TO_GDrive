name: Test replace_mode option with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to upload
        run: |
          echo "test content for replace mode test" > /tmp/replace-mode-test.txt

      - id: action-update-in-place
        uses: .
        continue-on-error: true
        with:
          credentials: 'eyJpbnZhbGlkIjoianNvbiJ9'
          parent_folder_id: 'fake-folder-id-12345'
          target: '/tmp/replace-mode-test.txt'
          replace_mode: 'update_in_place'

      - name: Assert action failed with update_in_place replace_mode
        env:
          OUTCOME: ${{ steps.action-update-in-place.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials (update_in_place mode), but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with update_in_place replace_mode and invalid credentials"

      - id: action-delete-first
        uses: .
        continue-on-error: true
        with:
          credentials: 'eyJpbnZhbGlkIjoianNvbiJ9'
          parent_folder_id: 'fake-folder-id-12345'
          target: '/tmp/replace-mode-test.txt'
          replace_mode: 'delete_first'

      - name: Assert action failed with delete_first replace_mode
        env:
          OUTCOME: ${{ steps.action-delete-first.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials (delete_first mode), but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with delete_first replace_mode and invalid credentials"
