name: Test replace_mode and max_retention_count options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to upload
        run: |
          echo "test content for replace mode" > /tmp/test-replace.txt

      - id: action-update-in-place
        uses: .
        continue-on-error: true
        with:
          credentials: ${{ 'eyJrZXkiOiAiZmFrZSJ9' }}
          parent_folder_id: "fake_folder_id_12345"
          target: "/tmp/test-replace.txt"
          replace_mode: "update_in_place"
          max_retention_count: "3"

      - name: Assert update_in_place mode failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action-update-in-place.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials for update_in_place mode"

      - id: action-delete-first
        uses: .
        continue-on-error: true
        with:
          credentials: ${{ 'eyJrZXkiOiAiZmFrZSJ9' }}
          parent_folder_id: "fake_folder_id_12345"
          target: "/tmp/test-replace.txt"
          replace_mode: "delete_first"

      - name: Assert delete_first mode failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action-delete-first.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials for delete_first mode"
