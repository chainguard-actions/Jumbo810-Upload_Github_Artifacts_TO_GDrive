name: Test replace_mode option with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to upload
        run: |
          echo "replace mode test content" > /tmp/test-replace.txt

      - name: Run action with replace_mode=update_in_place (expect failure due to invalid credentials)
        id: action-update
        uses: .
        continue-on-error: true
        with:
          credentials: "aW52YWxpZC1jcmVkZW50aWFscw=="
          parent_folder_id: "fake-folder-id-12345"
          target: "/tmp/test-replace.txt"
          replace_mode: "update_in_place"

      - name: Assert action failed (invalid credentials)
        run: |
          echo "outcome: ${{ steps.action-update.outcome }}"
          if [ "${{ steps.action-update.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: ${{ steps.action-update.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when using replace_mode=update_in_place with invalid credentials"

      - name: Create another test file
        run: |
          echo "delete first test content" > /tmp/test-delete-first.txt

      - name: Run action with replace_mode=delete_first (expect failure due to invalid credentials)
        id: action-delete
        uses: .
        continue-on-error: true
        with:
          credentials: "aW52YWxpZC1jcmVkZW50aWFscw=="
          parent_folder_id: "fake-folder-id-12345"
          target: "/tmp/test-delete-first.txt"
          replace_mode: "delete_first"

      - name: Assert second action also failed (invalid credentials)
        run: |
          echo "outcome: ${{ steps.action-delete.outcome }}"
          if [ "${{ steps.action-delete.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: ${{ steps.action-delete.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when using replace_mode=delete_first with invalid credentials"
