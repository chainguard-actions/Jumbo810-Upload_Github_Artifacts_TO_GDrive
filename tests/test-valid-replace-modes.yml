name: Test valid replace_mode values are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy target file
        run: echo "test content" > /tmp/test-artifact.txt

      # Test replace_mode=add_new (default) - should fail at credentials, not replace_mode validation
      - id: action_add_new
        uses: .
        continue-on-error: true
        with:
          credentials: 'aW52YWxpZC1jcmVkZW50aWFscw=='
          parent_folder_id: 'fake-folder-id'
          target: '/tmp/test-artifact.txt'
          replace_mode: 'add_new'

      - name: Assert add_new mode passes validation (fails at credentials, not replace_mode)
        env:
          OUTCOME: ${{ steps.action_add_new.outcome }}
        run: |
          echo "outcome for add_new: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at credentials stage), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: add_new replace_mode passed validation (action failed at credentials as expected)"

      # Test replace_mode=delete_first - should fail at credentials, not replace_mode validation
      - id: action_delete_first
        uses: .
        continue-on-error: true
        with:
          credentials: 'aW52YWxpZC1jcmVkZW50aWFscw=='
          parent_folder_id: 'fake-folder-id'
          target: '/tmp/test-artifact.txt'
          replace_mode: 'delete_first'

      - name: Assert delete_first mode passes validation
        env:
          OUTCOME: ${{ steps.action_delete_first.outcome }}
        run: |
          echo "outcome for delete_first: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at credentials stage), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: delete_first replace_mode passed validation (action failed at credentials as expected)"

      # Test replace_mode=update_in_place - should fail at credentials, not replace_mode validation
      - id: action_update_in_place
        uses: .
        continue-on-error: true
        with:
          credentials: 'aW52YWxpZC1jcmVkZW50aWFscw=='
          parent_folder_id: 'fake-folder-id'
          target: '/tmp/test-artifact.txt'
          replace_mode: 'update_in_place'

      - name: Assert update_in_place mode passes validation
        env:
          OUTCOME: ${{ steps.action_update_in_place.outcome }}
        run: |
          echo "outcome for update_in_place: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at credentials stage), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: update_in_place replace_mode passed validation (action failed at credentials as expected)"
