name: Test valid replace_mode values are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy target file
        run: echo "hello world" > /tmp/test-upload.txt

      # Test that 'delete_first' is a valid replace_mode (fails at credentials, not replace_mode)
      - id: action-delete-first
        uses: .
        continue-on-error: true
        with:
          credentials: 'not-real-credentials'
          parent_folder_id: 'fake-folder-id'
          target: '/tmp/test-upload.txt'
          replace_mode: 'delete_first'

      # Test that 'update_in_place' is a valid replace_mode (fails at credentials, not replace_mode)
      - id: action-update-in-place
        uses: .
        continue-on-error: true
        with:
          credentials: 'not-real-credentials'
          parent_folder_id: 'fake-folder-id'
          target: '/tmp/test-upload.txt'
          replace_mode: 'update_in_place'

      # Test that 'add_new' is a valid replace_mode (fails at credentials, not replace_mode)
      - id: action-add-new
        uses: .
        continue-on-error: true
        with:
          credentials: 'not-real-credentials'
          parent_folder_id: 'fake-folder-id'
          target: '/tmp/test-upload.txt'
          replace_mode: 'add_new'

      - name: Assert all valid replace_mode values were accepted (failed at credentials, not replace_mode)
        run: |
          echo "delete_first outcome: ${{ steps.action-delete-first.outcome }}"
          echo "update_in_place outcome: ${{ steps.action-update-in-place.outcome }}"
          echo "add_new outcome: ${{ steps.action-add-new.outcome }}"

          # All should fail (at credentials stage), meaning replace_mode was accepted
          if [ "${{ steps.action-delete-first.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (at credentials stage) for delete_first"
            exit 1
          fi
          if [ "${{ steps.action-update-in-place.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (at credentials stage) for update_in_place"
            exit 1
          fi
          if [ "${{ steps.action-add-new.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (at credentials stage) for add_new"
            exit 1
          fi
          echo "PASS: all valid replace_mode values were accepted by the action"
