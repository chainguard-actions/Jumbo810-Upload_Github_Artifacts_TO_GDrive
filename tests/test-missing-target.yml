name: Test missing target file error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: 'aW52YWxpZC1jcmVkZW50aWFscw=='
          parent_folder_id: 'fake-folder-id'
          target: '/tmp/this-file-does-not-exist-12345.txt'

      - name: Assert action failed due to missing target
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when target file is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when target file does not exist"
