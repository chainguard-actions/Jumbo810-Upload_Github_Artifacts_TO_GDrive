name: Test missing target file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build a fake (but structurally valid) credentials JSON
        run: |
          # Create a minimal service account JSON with required fields
          CREDS_JSON='{"type":"service_account","client_email":"test@test-project.iam.gserviceaccount.com","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqKFoHBCBbMnFBMEMwWk\nfake-key-data\n-----END RSA PRIVATE KEY-----\n","project_id":"test-project"}'
          echo "FAKE_CREDS=$(echo "$CREDS_JSON" | base64 -w 0)" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: ${{ env.FAKE_CREDS }}
          parent_folder_id: 'fake-folder-id'
          target: '/tmp/this-file-does-not-exist.txt'

      - name: Assert action failed due to missing target
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when target file does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed when target file is missing"
