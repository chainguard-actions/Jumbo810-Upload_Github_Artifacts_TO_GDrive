name: Test optional parameters are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test artifact file
        run: |
          echo "optional params test content" > /tmp/optional-test.txt

      - name: Run action with optional parameters and invalid credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          credentials: "aW52YWxpZC1jcmVkZW50aWFscw=="
          parent_folder_id: "fake-folder-id-12345"
          target: "/tmp/optional-test.txt"
          name: "renamed-artifact.txt"
          child_folder: "test-subfolder/nested"
          override: false
          replace_mode: "add_new"
          max_retention_count: 5
          convert_files: false
          set_metadata: true
          send_share_notification: false

      - name: Assert action failed (expected with invalid credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly processed optional parameters and failed at credential validation"
