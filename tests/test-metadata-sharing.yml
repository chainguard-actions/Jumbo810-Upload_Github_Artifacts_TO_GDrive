name: Test metadata and sharing options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test CSV file to upload
        run: |
          printf "col1,col2,col3\nval1,val2,val3\n" > /tmp/test-data.csv

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: ${{ 'eyJrZXkiOiAiZmFrZSJ9' }}
          parent_folder_id: "fake_folder_id_12345"
          target: "/tmp/test-data.csv"
          set_metadata: "true"
          share_with: "user@example.com,other@example.com"
          send_share_notification: "false"
          convert_files: "true"

      - name: Assert action failed with invalid credentials (metadata/sharing scenario)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials for metadata/sharing scenario"
