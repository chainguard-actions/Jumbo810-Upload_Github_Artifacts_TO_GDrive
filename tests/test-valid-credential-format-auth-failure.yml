name: Test valid credential format but auth failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to upload
        run: echo "test content" > /tmp/test-artifact.txt

      - name: Prepare fake credentials
        id: creds
        run: |
          # Create a syntactically valid service account JSON with a fake private key
          # The action will parse this successfully but fail at auth.authorize()
          CREDS_JSON='{"type":"service_account","project_id":"fake-project","private_key_id":"key123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAFPpF9y9KKZP0gRQbGMB\nfake-key-content\n-----END RSA PRIVATE KEY-----\n","client_email":"fake-sa@fake-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          ENCODED=$(echo "$CREDS_JSON" | base64 -w 0)
          echo "encoded=$ENCODED" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: ${{ steps.creds.outputs.encoded }}
          parent_folder_id: 'fake-folder-id'
          target: '/tmp/test-artifact.txt'

      - name: Assert action failed at authentication step
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid auth credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed at authentication with invalid credentials"
