name: Test optional inputs (name, child_folder, override, replace_mode)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test artifact file
        run: |
          echo "optional inputs test artifact" > /tmp/optional-test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: ${{ 'eyJmYWtlIjoidGVzdCJ9' }}
          parent_folder_id: "fake-folder-id-12345"
          target: /tmp/optional-test.txt
          name: "my-custom-name.txt"
          child_folder: "test-subfolder/nested"
          override: false
          replace_mode: "update_in_place"
          max_retention_count: 3
          convert_files: false
          set_metadata: true

      - name: Assert action ran with optional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with an auth/API error,
          # not crash due to unrecognized optional inputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted optional inputs and ran"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
