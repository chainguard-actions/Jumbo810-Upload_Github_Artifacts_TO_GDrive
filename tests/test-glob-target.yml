name: Test glob pattern target (multiple files)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple test artifact files
        run: |
          mkdir -p /tmp/glob-test
          echo "artifact one" > /tmp/glob-test/file1.txt
          echo "artifact two" > /tmp/glob-test/file2.txt
          echo "artifact three" > /tmp/glob-test/file3.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: ${{ 'eyJmYWtlIjoidGVzdCJ9' }}
          parent_folder_id: "fake-folder-id-12345"
          target: /tmp/glob-test/*.txt

      - name: Assert action ran with glob pattern
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with an auth/API error,
          # not crash due to glob pattern in target.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted glob pattern target and ran"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
