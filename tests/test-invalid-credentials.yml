name: Test invalid credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test artifact file
        run: |
          echo "test artifact content" > /tmp/test-artifact.txt

      - name: Run action with invalid credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          credentials: "aW52YWxpZC1jcmVkZW50aWFscw=="
          parent_folder_id: "fake-folder-id-12345"
          target: "/tmp/test-artifact.txt"

      - name: Assert action failed with invalid credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
