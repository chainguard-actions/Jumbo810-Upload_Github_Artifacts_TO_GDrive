name: Test invalid credentials format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to upload
        run: echo "test content" > /tmp/test-artifact.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: 'not-valid-base64-or-json'
          parent_folder_id: 'fake-folder-id'
          target: '/tmp/test-artifact.txt'

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
