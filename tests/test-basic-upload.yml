name: Test basic upload (invalid credentials error handling)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test artifact file
        run: |
          echo "hello world artifact" > /tmp/test-artifact.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials: ${{ 'eyJmYWtlIjoidGVzdCJ9' }}
          parent_folder_id: "fake-folder-id-12345"
          target: /tmp/test-artifact.txt

      - name: Assert action ran (even if it failed due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with an auth error,
          # not with an unexpected crash unrelated to credentials.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a deterministic outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
