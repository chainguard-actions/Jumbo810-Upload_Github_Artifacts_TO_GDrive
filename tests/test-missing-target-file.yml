name: Test missing target file error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build a valid-looking (but fake) credentials JSON and base64-encode it
        id: creds
        run: |
          CREDS_JSON='{"client_email":"test@test-project.iam.gserviceaccount.com","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAFOCkMBFCFMBFCFMBFCF\n-----END RSA PRIVATE KEY-----\n","type":"service_account"}'
          ENCODED=$(echo -n "$CREDS_JSON" | base64 -w 0)
          echo "encoded=$ENCODED" >> $GITHUB_OUTPUT

      - name: Run action with non-existent target file (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          credentials: ${{ steps.creds.outputs.encoded }}
          parent_folder_id: "fake-folder-id"
          target: "/tmp/this-file-does-not-exist-at-all.txt"

      - name: Assert action failed due to missing target file
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with missing target file, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed with missing target file"
